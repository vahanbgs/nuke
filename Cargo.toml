[workspace]
resolver = "3"
members = [
  "crates/nuke-cli",
  "crates/nuke-eval",
  "crates/nuke-fixtures",
  "crates/nuke-grammar",
  "crates/nuke-lint",
  "crates/nuke-resolve",
  "crates/nuke-syntax",
  "crates/nuke-transpile",
]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.85"

[workspace.dependencies]
nuke-eval = { path = "crates/nuke-eval" }
nuke-fixtures = { path = "crates/nuke-fixtures" }
nuke-grammar = { path = "crates/nuke-grammar" }
nuke-lint = { path = "crates/nuke-lint" }
nuke-resolve = { path = "crates/nuke-resolve" }
nuke-syntax = { path = "crates/nuke-syntax" }
nuke-transpile = { path = "crates/nuke-transpile" }
clap = { version = "4", features = ["derive"] }
gix-config = { version = "0.59", features = ["sha1"] }
indexmap = "2"
kdl = "6"
mlua = { version = "0.11", features = ["lua54", "vendored"] }
quick-xml = "0.41"
rnix = "0.14"
rust-ini = { version = "0.21", features = ["inline-comment"] }
ryu = "1"
saphyr = "0.0.11"
serde ={ version = "1", default-features = false, features = ["std"] }
serde_json = "1"
tempfile = "3"
toml = { version = "0.9", features = ["preserve_order"] }

[workspace.lints.rust]
warnings = { level = "deny", priority = -1 }
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
