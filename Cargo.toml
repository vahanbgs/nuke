[workspace]
resolver = "3"
members = [
  "crates/nuke-fixtures",
  "crates/nuke-grammar",
  "crates/nuke-syntax",
  "crates/nuke-transpile",
]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.85"

[workspace.dependencies]
nuke-fixtures = { path = "crates/nuke-fixtures" }
nuke-grammar = { path = "crates/nuke-grammar" }
nuke-syntax = { path = "crates/nuke-syntax" }
indexmap = "2"
quick-xml = "0.41"
ryu = "1"
saphyr = "0.0.11"
serde ={ version = "1", default-features = false, features = ["std"] }
serde_json = "1"
toml = { version = "0.9", features = ["preserve_order"] }

[workspace.lints.rust]
warnings = { level = "deny", priority = -1 }
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
